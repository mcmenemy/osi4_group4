# Team corrections applied on top of extracted records when they load (data.load_records).
# Kept separate from the records so re-extraction can't undo them and every change is visible.
# Match records by their source PDF (file) or by record_id; set any top-level record fields
# (material_class, material_key, electrode_material) or source fields, and say why in `note`.
# `biology` sets biology fields (e.g. cell_category); `values` corrects one value by path, with a
# new verbatim quote if the old one doesn't support the corrected value.

by_file:
  Adewole2024.pdf:
    source:
      title: Development of optically controlled "living electrodes" with long-projecting axon tracts for a synaptic brain-machine interface
      first_author: Adewole
      year: 2021
      doi: 10.1126/sciadv.aay5347
      url: https://doi.org/10.1126/sciadv.aay5347
    note: Cited as the published Science Advances 2021 version (Crossref); the PDF is the bioRxiv preprint.

  rochford2023.pdf:
    material_class: biohybrid_device
    material_key: fibrin
    electrode_material: PEDOT:PSS
    note: Biohybrid device (PEDOT:PSS electrode array + fibrin cell layer). Grouped with fibrin as the cell carrier; the PEDOT:PSS array's electrical values describe the electrode and don't set fibrin's properties.

by_record:
  # Seidlits 2010: the PDF's text layer renders "µm" as "mm"; Fig. 5 shows micrometer-scale processes.
  # The 6-24 h degradation times are in 1000 U/mL hyaluronidase (an accelerated assay); with cells in
  # culture the paper says most gels degraded by the fourth week, which is the relevant timescale.
  seidlits-2010-5x-maha-hydrogel-methacr-dd5baa:
    biology:
      cell_category: sc_neuron
    values:
      biology.neurite_length: {value: "up to 600", unit: "µm"}
      properties.degradation_time:
        value: "4"
        unit: weeks
        evidence: the majority of hydrogels completely degraded by the fourth week
    note: "Neurite length is µm (PDF renders µ as m). Degradation is with cells in culture (~4 weeks; the 6 h figure is in concentrated hyaluronidase). Cells are E13.5 neural progenitors, so sc_neuron."
  seidlits-2010-10x-maha-hydrogel-methac-362262:
    biology:
      cell_category: sc_neuron
    values:
      biology.neurite_length: {value: "up to 200", unit: "µm"}
      properties.degradation_time:
        value: "4"
        unit: weeks
        evidence: the majority of hydrogels completely degraded by the fourth week
    note: "Neurite length is µm (PDF renders µ as m). Degradation is with cells in culture (~4 weeks; the 12 h figure is in concentrated hyaluronidase). Cells are E13.5 neural progenitors, so sc_neuron."
  seidlits-2010-20x-maha-hydrogel-methac-7e5e0a:
    biology:
      cell_category: sc_neuron
    values:
      properties.degradation_time:
        value: "4"
        unit: weeks
        evidence: the majority of hydrogels completely degraded by the fourth week
    note: "Degradation is with cells in culture (~4 weeks; the 24 h figure is in concentrated hyaluronidase). Cells are E13.5 neural progenitors, so sc_neuron."

  # Ballios 2015: "86% of mice (6 of 7) had cells present" and "70% (7 of 10) of the animals had
  # surviving cells" are shares of animals, not of cells, so they aren't survival rates.
  ballios-2015-hamc-hyaluronan-and-meth-3a4380:
    drop_survival: [1, 2]
    note: "Removed two 'occupancy' values that were % of animals with any surviving cells, not % of cells."

  # Adil 2017: neurons were differentiated in the PNIPAAm-PEG gel, then "harvested and dissociated"
  # and implanted without it, so the 35.6% survival at 6 weeks isn't evidence for the gel in brain.
  adil-2017-pnipaam-peg-thermorespon-f441d0:
    drop_survival: [0]
    note: "Removed the 35.6% in vivo survival: cells were made in the gel but implanted without it (methods, 'harvested and dissociated')."
